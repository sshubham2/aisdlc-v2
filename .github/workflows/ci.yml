name: CI

# The plugin's own test + consistency gates (remediation 4.4). Before this, ~70
# shipped .py files had zero tests and zero CI — which is how the Phase-1 bugs
# survived (nothing deterministic ever exercised the happy path).

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both OSes are load-bearing: the vault writer / git runners carry
        # Windows-specific code paths (msvcrt locking, EPERM retry, CRLF).
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure git identity
        # Tests that shell out to git-authoring tools (claim_candidate etc.) need a
        # committer identity; GitHub runners have none by default. Exposed when the
        # accumulated slices 016-022 first reached origin CI at the 2.36.0 release.
        run: |
          git config --global user.name "aisdlc-ci"
          git config --global user.email "aisdlc-ci@users.noreply.github.com"
      - name: Install dev deps
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest

  build-consistency:
    name: build-consistency (lint + cross-block + aggregate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev deps
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: artifact_lint --self-check (schema-by-example)
        run: python scripts/lib/artifact_lint.py --self-check
      - name: cross-block audit (SKILL.md bash blocks)
        run: python .build/cross_block_audit.py skills/*/SKILL.md
      - name: aggregate.py is clean (no uncommitted generated drift in examples/)
        # The design record (skill.json / skill-graph.json) is git-ignored (4.10), so a
        # regen leaves it untracked and out of `git diff`; this gate now guards the
        # TRACKED generated artifacts — the bundled examples/. --ignore-cr-at-eol: those
        # were generated on Windows (CRLF) and aggregate.py writes platform-native EOL,
        # so a Linux regen flips EOL only; only real content drift should fail.
        run: |
          python .build/aggregate.py
          git diff --ignore-cr-at-eol --exit-code

  plugin-self-audits:
    name: plugin self-audits
    runs-on: ubuntu-latest
    # GATING: all 7 pass on the current tree (UTF8-STDOUT-1 conformance fixed in
    # v2.20.1; PCA-1 reconciled in v2.20.2 — its successor matcher now accepts the
    # canonical edge listed alongside the conditional design-spike + slice-story).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev deps
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Plugin self-audits
        run: python .build/plugin_self_audits.py

  release-guard:
    name: release-guard (master advanced only via versioned cuts)
    # Detective gate (ADR-015 / SC-049): runs ONLY on push to master, where
    # actions/checkout creates a local refs/heads/master and leaves origin/HEAD
    # unset, so release_advance_audit resolves released=master and the
    # genesis-pinned first-parent walk works. A pull_request's detached merge-ref
    # has no local master -> the audit exits 2, so this is intentionally NOT a PR
    # check; pre-merge prevention is delegated to master branch protection.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 brings full history AND all tags (incl. the release-genesis
          # tag); the default shallow/no-tags checkout makes the audit exit 2 (spike A1).
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Assert master advanced only via versioned release cuts
        # Any non-zero exit fails the job: 1 = unversioned advance (prints the offending
        # commit sha), 2 = genesis-absent / usage error. release_advance_audit is
        # stdlib-only, so no dependency install is needed.
        run: python scripts/lib/release_advance_audit.py --root .
